# System Resource & Performance Monitor Configuration
# This file provides example configuration settings
# Current implementation uses default values - extend config_load() to parse this file

[monitoring]
# Sample interval in milliseconds (default: 5000)
sample_interval_ms = 5000

# Data retention period in days (default: 30)
retention_days = 30

# Enable process-level monitoring (0=disabled, 1=enabled)
enable_process_monitoring = 1

[database]
# Path to SQLite database
db_path = data/metrics.db

[logging]
# Path to log file
log_file = system_monitor.log

# Log level (0=DEBUG, 1=INFO, 2=WARN, 3=ERROR)
log_level = 1

[features]
# Enable CPU usage collection
enable_cpu = 1

# Enable memory usage collection
enable_memory = 1

# Enable disk I/O collection (requires additional implementation)
enable_disk_io = 0

# Enable network I/O collection (requires additional implementation)
enable_network_io = 0

# Enable GPU monitoring (requires additional implementation)
enable_gpu = 0

# Enable CPU temperature (requires additional implementation)
enable_cpu_temp = 0
